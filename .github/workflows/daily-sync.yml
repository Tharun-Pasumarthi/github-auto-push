name: Daily GitHub Heartbeat

on:
  schedule:
    # 10:45 UTC = 16:15 India Standard Time (4:15 PM IST, UTC+05:30)
    # Cloud-native GitHub Actions trigger: runs 100% in the cloud even when your device is offline
    - cron: "45 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-github-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Daily Check, Report, and Central Push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout central repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check monitored repositories, generate report, and push central heartbeat
        env:
          # Separate read-only fine-grained token for private monitored repositories.
          # Never exposed to Git push operations; falls back to GITHUB_TOKEN for public repos.
          REPOSITORY_READ_TOKEN: ${{ secrets.REPOSITORY_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.scheduler --push

      - name: Upload diagnostic execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heartbeat-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore
